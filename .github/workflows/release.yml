name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ReleaseCI
    permissions:
      contents: write  # 创建 release 所需权限
    
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录，用于tag检查
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "Keystore decoded successfully"
        else
          echo "Warning: KEYSTORE_BASE64 not set, skipping signing"
        fi

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      env:
        KEYSTORE_FILE: release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
          ./gradlew assembleRelease
        else
          echo "Warning: Signing credentials not set, building debug only"
          ./gradlew build
        fi
    
    # 从 build.gradle.kts 提取版本信息
    - name: Extract version from build.gradle.kts
      id: extract_version
      run: |
        # 查找 build.gradle.kts 文件位置
        if [ -f "app/build.gradle.kts" ]; then
          GRADLE_FILE="app/build.gradle.kts"
        elif [ -f "build.gradle.kts" ]; then
          GRADLE_FILE="build.gradle.kts"
        else
          echo "Error: build.gradle.kts not found"
          exit 1
        fi
        
        echo "Using gradle file: $GRADLE_FILE"
        
        # 提取 versionName
        VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' $GRADLE_FILE | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | head -n 1)
        
        # 如果提取失败，报错退出
        if [ -z "$VERSION_NAME" ]; then
          echo "Error: versionName not found in $GRADLE_FILE"
          exit 1
        fi
        
        # 确保版本号以 v 开头（用于 tag）
        if [[ ! $VERSION_NAME =~ ^v ]]; then
          VERSION_NAME="v$VERSION_NAME"
        fi
        
        echo "Extracted versionName: $VERSION_NAME"
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        
        # 保存到环境变量供后续步骤使用
        echo "VERSION=$VERSION_NAME" >> $GITHUB_ENV
    
    # 显示版本信息
    - name: Show version info
      run: |
        echo "Version: ${{ steps.extract_version.outputs.version }}"
    
    # 检查 tag 是否存在
    - name: Check if tag exists
      id: check_tag
      run: |
        TAG="${{ steps.extract_version.outputs.version }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists"
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "::warning::Tag $TAG already exists, skipping tag creation"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    
    # 创建 Git Tag
    - name: Create Git Tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        TAG="${{ steps.extract_version.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag $TAG
        git push origin $TAG
        echo "Tag $TAG created successfully"
    
    # 创建 GitHub Release (使用 v3)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.extract_version.outputs.version }}
        name: Release ${{ steps.extract_version.outputs.version }}
        body: |
          ## Release ${{ steps.extract_version.outputs.version }}
          
          This release is automatically generated from version ${{ steps.extract_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        make_latest: true
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # 上传构建产物 (作为备用)
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: apks-${{ steps.extract_version.outputs.version }}
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
